<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - TAP DRIVE</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background: #0f172a; color: #fff; padding: 20px; max-width: 600px; margin: auto; }
    h2 { margin-bottom: 20px; color: #38bdf8; }
    .card { background: #1e293b; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid #334155; }
    input { width: 100%; padding: 12px; margin-bottom: 12px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 1rem; }
    button { width: 100%; padding: 14px; background: #38bdf8; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; color: #0f172a; font-size: 1rem; }
    .motorista-item { background: #0f172a; padding: 14px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #334155; }
  </style>
</head>
<body>

  <!-- TELA DE SENHA -->
  <div id="login-admin" class="card">
    <h2>Acesso do Proprietário</h2>
    <input type="password" id="senha-admin" placeholder="Digite a senha (padrão: 1234)">
    <button onclick="carregarAdmin()">Entrar no Painel</button>
  </div>

  <!-- PAINEL -->
  <div id="painel-admin" style="display: none;">
    <h2>Painel do Proprietário</h2>

    <div class="card">
      <h3 style="margin-bottom: 12px; color: #4ade80;">+ Cadastrar Motorista</h3>
      <input type="text" id="novo-nome" placeholder="Nome Completo do Motorista">
      <input type="text" id="novo-id" placeholder="ID (ex: 102 ou celular dele)">
      <input type="text" id="novo-whats" placeholder="WhatsApp">
      <button onclick="cadastrarMotorista()">Cadastrar e Liberar Acesso</button>
    </div>

    <div class="card">
      <h3 style="margin-bottom: 12px;">Seus Clientes Ativos</h3>
      <div id="lista-motoristas">Carregando...</div>
    </div>
  </div>

  <script>
    // SEU LINK OFICIAL INJETADO:
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxSjygvxtO0Rwh3txwztrsjWXoqYGtGcQS_pGk54KDLu7gZAP-DIvXDX9PF_m4EwI2I/exec";
    let senhaSalva = "";

    function carregarAdmin() {
      senhaSalva = document.getElementById("senha-admin").value;
      fetch(`${SCRIPT_URL}?action=getAdminData&senha=${senhaSalva}`)
        .then(r => r.json())
        .then(res => {
          if (!res.sucesso) return alert(res.erro || "Senha incorreta");
          document.getElementById("login-admin").style.display = "none";
          document.getElementById("painel-admin").style.display = "block";
          renderizarLista(res.motoristas);
        });
    }

    function renderizarLista(lista) {
      const container = document.getElementById("lista-motoristas");
      if (!lista || lista.length === 0) return container.innerHTML = "<p>Nenhum motorista cadastrado ainda.</p>";
      
      container.innerHTML = lista.map(m => `
        <div class="motorista-item">
          <div>
            <strong>${m.nome}</strong><br>
            <small style="color: #94a3b8;">ID: ${m.id} | WhatsApp: ${m.whatsapp}</small>
          </div>
          <button style="width: auto; padding: 8px 12px; font-size: 0.8rem;" onclick="copiarLink('${m.id}')">Copiar Link</button>
        </div>
      `).join("");
    }

    function cadastrarMotorista() {
      const nome = document.getElementById("novo-nome").value;
      const id = document.getElementById("novo-id").value;
      const whats = document.getElementById("novo-whats").value;
      if (!nome || !id) return alert("Preencha nome e ID!");

      fetch(SCRIPT_URL, {
        method: "POST",
        body: JSON.stringify({ action: "addMotorista", senha: senhaSalva, nome: nome, id: id, whatsapp: whats })
      }).then(() => {
        alert("Motorista cadastrado com sucesso!");
        document.getElementById("novo-nome").value = "";
        document.getElementById("novo-id").value = "";
        document.getElementById("novo-whats").value = "";
        carregarAdmin();
      });
    }

    function copiarLink(id) {
      const urlBase = window.location.origin;
      const linkPronto = `${urlBase}/?id=${id}`;
      navigator.clipboard.writeText(linkPronto);
      alert(`Link copiado: ${linkPronto}`);
    }
  </script>
</body>
</html>
